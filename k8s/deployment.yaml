apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle7-dashboard
  labels:
    app: vle7-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle7-dashboard
  template:
    metadata:
      labels:
        app: vle7-dashboard
    spec:
      containers:
        - name: dashboard
          image: vle7-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
